services:
  main:
    build:
      context: .
    command: ["sleep", "infinity"]
    user: "10001:10001"
    depends_on:
      runtime-setup:
        condition: service_completed_successfully
      floci:
        condition: service_healthy
    environment:
      HTTP_PROXY: http://172.20.0.1:18080
      http_proxy: http://172.20.0.1:18080
      HTTPS_PROXY: http://172.20.0.1:18080
      https_proxy: http://172.20.0.1:18080
      NO_PROXY: localhost,127.0.0.1,::1,aws,000000000000.aws,floci,runtime-setup
      no_proxy: localhost,127.0.0.1,::1,aws,000000000000.aws,floci,runtime-setup
      CURL_CA_BUNDLE: /etc/daytona-netleash-ca.crt
      SSL_CERT_FILE: /etc/daytona-netleash-ca.crt
      REQUESTS_CA_BUNDLE: /etc/daytona-netleash-ca.crt
      NODE_EXTRA_CA_CERTS: /etc/daytona-netleash-ca.crt
    networks: [solver-control, agent]
    volumes:
      - config:/workspace/config:ro
      - /etc/daytona/netleash/ca.crt:/etc/daytona-netleash-ca.crt:ro

  runtime-setup:
    image: mirror.gcr.io/library/docker:27.5.1-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    command: ["/bin/sh", "/runtime.sh"]
    networks: [solver-control]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./application:/application:ro
      - ./runtime.sh:/runtime.sh:ro
      - config:/config

  floci:
    image: mirror.gcr.io/floci/floci:1.5.33@sha256:d2ecc8035822b23b8587a56eab15edd825f41d3fb80d93e8e66680410beddc08
    environment:
      FLOCI_DOCKER_DOCKER_HOST: unix:///var/run/docker.sock
      FLOCI_DOCKER_RESOURCE_NAMESPACE: ${COMPOSE_PROJECT_NAME}
      FLOCI_HOSTNAME: aws
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_workload
      FLOCI_SERVICES_ECS_MOCK: "false"
      FLOCI_SERVICES_ECS_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_workload
    networks:
      solver-control:
        aliases: [aws, 000000000000.aws]
      workload:
        aliases: [aws, 000000000000.aws]
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  agent: {}
  solver-control:
    internal: true
  workload:
    name: ${COMPOSE_PROJECT_NAME}_workload
    internal: true

volumes:
  config: {}
  floci-data: {}
