schema_version = "1.1"

artifacts = [
  { source = "/workspace/submission", destination = "submission", exclude = [
    "*/.terraform",
    "*/.terraform/**",
    "*/terraform.tfstate",
    "*/terraform.tfstate.*",
    "*/config.auto.tfvars.json",
    "*/.terraform.tfstate.lock.info",
  ] },
  { source = "/workspace/evidence", destination = "evidence" },
]

[task]
name = "devcloud/signedgate2-object-access"
description = "Build a private, RBAC-aware file exchange that issues operation-bound S3 presigned URLs through a controlled network path. v2 of signedgate-object-access with weighted scoring, closed test-coverage gaps and hardened platform contracts."
keywords = [
  "networking-and-traffic",
  "terraform",
  "s3",
  "presigned-url",
  "rbac",
  "ecs",
  "vpc-endpoint",
]
authors = [{ name = "Deen", email = "phab019@expert.micro1.ai" }]

